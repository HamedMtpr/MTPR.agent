name: CI

on:
  push:
    branches: [main, "M*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MTPR.Agent.slnx

      - name: Build
        run: dotnet build MTPR.Agent.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test MTPR.Agent.slnx --no-build --configuration Release --collect:"XPlat Code Coverage"
